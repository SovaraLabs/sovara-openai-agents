name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sovara-openai-agents
      # The packages use the SDK from a sovara checkout next to this repository, on the
      # branch in SOVARA_REF (default main). SOVARA_REPO_TOKEN must be able to read it.
      - uses: actions/checkout@v5
        with:
          repository: SovaraLabs/sovara
          ref: ${{ vars.SOVARA_REF || 'main' }}
          token: ${{ secrets.SOVARA_REPO_TOKEN }}
          path: sovara
      - uses: astral-sh/setup-uv@v7
      - name: Test and lint
        working-directory: sovara-openai-agents/python
        run: |
          uv sync --frozen
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sovara-openai-agents
      # The packages use the SDK from a sovara checkout next to this repository, on the
      # branch in SOVARA_REF (default main). SOVARA_REPO_TOKEN must be able to read it.
      - uses: actions/checkout@v5
        with:
          repository: SovaraLabs/sovara
          ref: ${{ vars.SOVARA_REF || 'main' }}
          token: ${{ secrets.SOVARA_REPO_TOKEN }}
          path: sovara
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Build the SDK
        working-directory: sovara/packages/typescript-sdk
        run: npm ci && npm run build
      - name: Check
        working-directory: sovara-openai-agents/typescript
        run: npm ci && npm run check
