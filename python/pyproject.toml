[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sovara-openai-agents"
version = "0.1.0"
description = "Sovara recording for the OpenAI Agents SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "sovara",
    # Function-tool capture needs 0.13+. Tested with 0.13.6; see the dev group.
    "openai-agents",
]

[project.urls]
Documentation = "https://docs.sovara-labs.com/sdks/integrations"
Repository = "https://github.com/SovaraLabs/sovara-openai-agents/tree/main/python"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sovara_openai_agents*"]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.17.2",
    # The versions the contract tests target; openai-agents 0.24 changed the tool executor.
    "openai==2.30.0",
    "openai-agents==0.13.6",
]

[tool.uv.sources]
# Development uses a sovara checkout next to this repository.
sovara = { path = "../../sovara/packages/python-sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B",
    "D100", "D101", "D102", "D103", "D104", "D106", "D107",
    "D200", "D205", "D400", "D401", "D419",
    "ERA001", "PGH004", "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1"]

[tool.ruff.lint.isort]
# Sovara's own packages sort together, as in the sovara repository.
known-first-party = ["sovara", "sovara_common", "sovara_openai_agents", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
